connection:
  bootstrap_servers:
    - "localhost:9092"
  sasl:
    mechanism: none
    username: ""
    password: ""
  tls:
    enabled: false
    ca_cert_path: ""

topics:
  - name: orders
    partitions: 6
    replication_factor: 1

producers:
  - id: orders-producer
    topic: orders
    rate: 100
    message:
      format: json
      template: |
        {"order_id": "{{uuid}}", "amount": {{float 5.0 500.0}}, "ts": "{{iso_now}}"}
      key_strategy: random

consumer_groups:
  - id: order-processor
    topics: [orders]
    members: 3
    behavior:
      type: normal
      processing_ms: 10
      commit_every: 100

scenarios:
  - name: "Rebalance storm"
    steps:
      - at_seconds: 0
        action: start_all

      - at_seconds: 30
        action: add_members
        target: order-processor
        count: 5

      - at_seconds: 45
        action: remove_members
        target: order-processor
        count: 7

      - at_seconds: 300
        action: stop_all
