connection:
  bootstrap_servers:
    - "localhost:9092"
  sasl:
    mechanism: none
    username: ""
    password: ""
  tls:
    enabled: false
    ca_cert_path: ""

topics:
  - name: orders
    partitions: 6
    replication_factor: 1
  - name: payments
    partitions: 3
    replication_factor: 1
  - name: notifications
    partitions: 12
    replication_factor: 1

producers:
  - id: orders-producer
    topic: orders
    rate: 50
    message:
      format: json
      template: |
        {"order_id": "{{uuid}}", "amount": {{float 5.0 500.0}}, "created_at": "{{iso_now}}"}
      key_strategy: random

  - id: payments-producer
    topic: payments
    rate: 20
    message:
      format: json
      template: |
        {"payment_id": "{{uuid}}", "amount": {{float 5.0 500.0}}}
      key_strategy: random

  - id: notifications-producer
    topic: notifications
    rate: 100
    message:
      format: string
      value: "User {{int 1 10000}} — event {{choice login logout purchase}}"
      key_strategy: none

consumer_groups:
  - id: order-processor
    topics: [orders]
    members: 3
    behavior:
      type: normal
      processing_ms: 10
      commit_every: 100

  - id: payment-validator
    topics: [payments]
    members: 2
    behavior:
      type: normal
      processing_ms: 50
      commit_every: 10

  - id: notification-sender
    topics: [notifications]
    members: 6
    behavior:
      type: normal
      processing_ms: 2
      commit_every: 500
